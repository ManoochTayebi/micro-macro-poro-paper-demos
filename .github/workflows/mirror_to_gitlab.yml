on:
  - push
  - delete

jobs:
  mirror_to_gitlab:
    if: github.repository_owner == 'mgenet'

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Sync repo
      uses: keninkujovic/gitlab-sync@2.1.0
      with:
        gitlab_url: https://gitlab.inria.fr/mgenet/Micro-macro-poro-paper-demos
        username: mgenet
        gitlab_pat: ${{secrets.GITLAB}}
        force_push: true
